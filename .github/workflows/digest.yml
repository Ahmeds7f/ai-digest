name: Weekly AI digest

on:
  schedule:
    # 13:00 UTC Saturday = 9am ET. Cron here is always UTC.
    - cron: "0 13 * * 6"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # for the archive commit below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Curate and send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python curate.py

      # Keeps a browsable history AND resets GitHub's 60-day inactivity
      # timer, so the schedule never gets silently disabled.
      - name: Archive digest
        run: |
          mkdir -p archive
          cp digest.html "archive/$(date +%F).html"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "Archive digest $(date +%F)" || echo "nothing new to commit"
          git push
